# hypridle listens on ext-idle-notify-v1 for idle events and on logind's D-Bus
# interface for lock and sleep events.

general {
    # Runs on logind's Lock signal, which loginctl lock-session emits. Every
    # lock path in this configuration goes through that signal, so this pidof
    # guard is what prevents a second hyprlock instance from being started.
    lock_cmd = pidof hyprlock || hyprlock

    # Runs on logind's PrepareForSleep signal, so it covers closing the lid,
    # the power menu and systemctl suspend alike.
    before_sleep_cmd = loginctl lock-session

    # Resuming from suspend leaves the outputs powered off whenever the 330 s
    # listener below has already fired, so they are switched back on here.
    after_sleep_cmd = niri msg action power-on-monitors

    # inhibit_sleep is deliberately left at its default of 2 (auto). niri does
    # not implement hyprland-lock-notify-v1, so hypridle cannot wait for the
    # lock surface and falls back to a plain logind delay inhibitor. If niri
    # ever implements that protocol, the auto detection upgrades this file to
    # the lock-notify behaviour with no edit, because lock_cmd contains
    # "hyprlock" and before_sleep_cmd contains "lock-session".
}

# Lock the session after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Power the outputs off 30 seconds after the lock, and back on when input
# resumes.
listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Suspend after 30 minutes. The first listener has already locked the session
# by this point.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
