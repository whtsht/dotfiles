source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
}

# 時刻
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_background
    font_size = 96
    font_family = Hack Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# 日付
label {
    monitor =
    text = cmd[update:60000] date +"%Y年%m月%d日 (%a)"
    color = $on_background
    font_size = 20
    font_family = Noto Sans CJK JP
    position = 0, 80
    halign = center
    valign = center
}

# 再生中のメディア。playerctl が動作していない場合は空行になる。
label {
    monitor =
    text = cmd[update:2000] ~/.config/niri/scripts/lock-media.sh
    color = $outline
    font_size = 14
    font_family = Noto Sans CJK JP
    position = 0, 30
    halign = center
    valign = center
}

# パスワード入力欄
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">パスワード</span>
    fail_text = <span foreground="##ff8888">認証に失敗しました ($ATTEMPTS)</span>
    rounding = 24
    position = 0, -60
    halign = center
    valign = center
}

# バッテリ残量
label {
    monitor =
    text = cmd[update:30000] printf 'BAT %s%%' "$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo '--')"
    color = $outline
    font_size = 12
    font_family = Hack Nerd Font
    position = -24, 24
    halign = right
    valign = bottom
}
