# Generated by matugen. Edits made here are lost on the next run.
# Source: ~/.config/matugen/templates/alacritty.toml

# Background, foreground, cursor and selection use the Material Design 3 roles
# derived from the wallpaper.
[colors.primary]
background = '{{colors.background.default.hex}}'
foreground = '{{colors.on_surface.default.hex}}'

[colors.selection]
text = '{{colors.on_surface.default.hex}}'
background = '{{colors.primary_container.default.hex}}'

[colors.cursor]
text = '{{colors.background.default.hex}}'
cursor = '{{colors.primary.default.hex}}'

# The 16 ANSI colors are fixed. The base16 set matugen provides is pulled
# toward the wallpaper hue and comes out too desaturated to tell red, green and
# yellow apart, so it is not usable as a terminal palette.
[colors.normal]
black   = '#141218'
red     = '#ff728f'
green   = '#7fff9a'
yellow  = '#ffda72'
blue    = '#7fb4ff'
magenta = '#e5a5ff'
cyan    = '#72e5e5'
white   = '#e6e0e9'

[colors.bright]
black   = '#9d99a5'
red     = '#ff9fb2'
green   = '#a5ffb8'
yellow  = '#ffe7a5'
blue    = '#a5cbff'
magenta = '#f0c6ff'
cyan    = '#a5f0f0'
white   = '#faf8ff'
