# matugen derives a Material Design 3 palette from the wallpaper and expands
# the templates below into a color definition file for each tool. It is run by
# ~/.config/niri/scripts/wallpaper.sh whenever the wallpaper changes.
#
# This file is hand-written. Every path listed in output_path below, however,
# is generated at run time and is excluded from chezmoi (see .chezmoiignore).
# The files that pull those colors in (style.css, hyprlock.conf, ...) are the
# ones tracked in this repository.

[config]

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/dms/colors.kdl'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/dank-theme.toml'

[templates.waybar]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/waybar/colors.css'

[templates.swaync]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/swaync/colors.css'

[templates.swayosd]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/swayosd/colors.css'

[templates.wofi]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/wofi/colors.css'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hypr-colors.conf'
output_path = '~/.config/hypr/colors.conf'
