# matugen derives a Material Design 3 palette from the wallpaper and expands
# the templates below into a color definition file for each tool. It is run by
# ~/.config/niri/scripts/wallpaper.sh whenever the wallpaper changes.
#
# This file is hand-written. Every path listed in output_path below, however,
# is generated at run time and is excluded from chezmoi (see .chezmoiignore).
# The files that pull those colors in (style.css, hyprlock.conf, ...) are the
# ones tracked in this repository.

[config]

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/colors.kdl'

[templates.alacritty]
input_path = '~/.config/matugen/templates/alacritty.toml'
output_path = '~/.config/alacritty/colors.toml'

# A single color definition file shared by the GTK panels. waybar, swaync,
# swayosd and wofi each import it from their own style.css by absolute path,
# so one output covers all four.
[templates.gtk]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/matugen/colors.css'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hypr-colors.conf'
output_path = '~/.config/hypr/colors.conf'

# GTK builds the path to the user stylesheet as
# $XDG_CONFIG_HOME/gtk-{3,4}.0/gtk.css with the directory and file name
# hard-coded (see g_build_filename in gtk/gtksettings.c), so the palette is
# written to that file directly instead of to a colors.css that gtk.css would
# have to import.
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-adwaita-colors.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-adwaita-colors.css'
output_path = '~/.config/gtk-4.0/gtk.css'
